[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Rust code imports this crate as `avcore`, not the bare package name `core` — a dependency
# literally named `core` shadows the sysroot `core` crate (verified: `use core::mem::...`
# resolves to this crate instead of libcore, breaking basically everything that needs it).
# The package (and this directory) stay named `core` for `cargo -p core`/Cargo.toml
# readability; only the Rust-side import name is different. See CLAUDE.md.
[lib]
name = "avcore"

[dependencies]
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
avbridge = { path = "../avbridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# .ocproj project file format: MessagePack in struct-map mode (keeps field names, unlike
# rmp-serde's default compact/array mode) so `#[serde(default)]` keeps working for a field
# added to Project/ClipInstance/etc. after a project was last saved — the same
# schema-evolution guarantee JSON gave, just binary. gzip-compressed on top for size/speed.
rmp-serde = "1"
flate2 = "1"
# CPU-only (default features) — no cuda/hipblas/metal/vulkan. Needs LIBCLANG_PATH set at build
# time (bindgen dependency) and outside a %TEMP%-rooted build dir on Windows (MSVC's FileTracker
# refuses FTK1011 there) — see CLAUDE.md.
whisper-rs = "0.16"
# Pure-Rust font metrics (advance widths) for word-highlight subtitles — measures each word's
# pixel width at the same font/size `avbridge_apply_text_overlays`'s drawtext filters render at,
# so per-word highlight overlays can be positioned to land exactly on top of the word they
# highlight. No C toolchain involved, unlike whisper-rs.
fontdue = "0.9"
# Blocking HTTP client for downloading Whisper GGML model files on demand — rustls (pure Rust)
# TLS backend, no OpenSSL/C toolchain. Verified against a real huggingface.co download before
# depending on it (got a real 200 with the exact known Content-Length back).
ureq = "2"
# ONNX Runtime bindings for auto-reframe's face-detection model (see `auto_reframe`).
# `download-binaries` fetches a prebuilt ONNX Runtime dynamic library at build time — same
# "not bundled in the installer yet" gap the Whisper model has, see `request.md`'s Fase 8
# packaging plan ("ONNX Runtime... empacotados junto").
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }

[dev-dependencies]
criterion = "0.8.2"
# Only for persistence_test.rs's defaulting test: hand-edits a decoded MessagePack map the
# same way the previous JSON test hand-edited a serde_json::Value.
rmpv = "1"

[[bench]]
name = "parsing"
harness = false
