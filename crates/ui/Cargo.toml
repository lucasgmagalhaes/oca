[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Package name is `core`; Rust code imports it as `avcore` (a dependency literally named
# `core` shadows the sysroot core crate) — see crates/core/Cargo.toml.
core = { path = "../core" }
# wgpu backend pulls in a broken windows-rs version graph (duplicate `windows_core` versions)
# in the current wgpu-hal 30.0.0 release on the dx12 path — glow (OpenGL) sidesteps it and is
# plenty for this 2D immediate-mode shell. Revisit when GStreamer needs a shared GPU texture.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1"
# tracing-subscriber and tracing-appender are used in main.rs::init_logging() to wire up
# the rolling-file + stderr subscriber. They're commented out because they are not yet in the
# local cargo cache and the build environment currently has no network access.  Once the
# deps are downloaded (cargo fetch), uncomment these two lines and restore init_logging().
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracing-appender = "0.2"
