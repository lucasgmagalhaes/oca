version: 2
updates:
  # Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "lucasgmagalhaes"
    allow:
      - dependency-type: "production"
      - dependency-type: "development"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:30"
    open-pull-requests-limit: 5
    reviewers:
      - "lucasgmagalhaes"
    commit-message:
      prefix: "ci(actions):"
      include: "scope"

  # Python dependencies (for e2e tests)
  - package-ecosystem: "pip"
    directory: "/e2e"
    schedule:
      interval: "daily"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "lucasgmagalhaes"
    commit-message:
      prefix: "chore(deps-e2e):"
      include: "scope"
