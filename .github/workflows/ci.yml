name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `core` links gstreamer/gstreamer-app/gstreamer-video (the `preview` module) via
      # gstreamer-sys crates, which locate GStreamer at build time through pkg-config — neither
      # is present on the windows-latest image by default, so both are set up explicitly here.
      # windows-latest's own pkg-config (MSYS2's) is known to choke on GStreamer's .pc files,
      # hence pkgconfiglite specifically (same guidance the setup-gstreamer action's README
      # gives) rather than whatever pkg-config the image already carries.
      - name: Install pkg-config
        run: choco install pkgconfiglite -y --no-progress

      - name: Setup GStreamer
        uses: blinemedical/setup-gstreamer@v1.4.0
        with:
          version: '1.26.11'
          arch: 'x86_64'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache FFmpeg dev build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-dev
          key: ffmpeg-btbn-win64-gpl-shared-master-latest

      # BtbN rotates its `latest` release tag on every nightly autobuild; a request landing
      # mid-rotation can hit the new tag before its assets finish uploading, returning a 404
      # that clears up within minutes. Retry with backoff instead of failing the whole job.
      - name: Download FFmpeg dev build (BtbN)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $uri = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl-shared.zip"
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $uri -OutFile ffmpeg.zip
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = 15 * $attempt
              Write-Host "Download failed (attempt $attempt/$maxAttempts): $($_.Exception.Message). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $inner = Get-ChildItem ffmpeg-extracted | Select-Object -First 1
          Move-Item $inner.FullName ffmpeg-dev

      - name: Export FFMPEG_DIR and PATH
        shell: pwsh
        run: |
          $ffmpegDir = (Resolve-Path "ffmpeg-dev").Path
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache FFmpeg dev build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-dev
          key: ffmpeg-btbn-linux64-gpl-shared-master-latest

      # Same retry logic as the Windows job; BtbN Linux tarballs live at the same `latest`
      # release tag and are subject to the same mid-rotation 404 window.
      - name: Download FFmpeg dev build (BtbN)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          uri="https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl-shared.tar.xz"
          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            if curl -fsSL -o ffmpeg.tar.xz "$uri"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Download failed after $max_attempts attempts" >&2
              exit 1
            fi
            delay=$((15 * attempt))
            echo "Download failed (attempt $attempt/$max_attempts). Retrying in ${delay}s..."
            sleep "$delay"
          done
          tar -xf ffmpeg.tar.xz
          dir=$(find . -maxdepth 1 -name 'ffmpeg-*' -type d | head -1)
          mv "$dir" ffmpeg-dev

      # FFMPEG_DIR must point at an extracted BtbN build whose include/ and lib/ match
      # what avbridge/build.rs expects. LD_LIBRARY_PATH lets the test runner find the
      # shared libs at runtime without a system-wide install.
      - name: Export FFMPEG_DIR and LD_LIBRARY_PATH
        run: |
          echo "FFMPEG_DIR=$(pwd)/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(pwd)/ffmpeg-dev/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  build-and-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Homebrew FFmpeg gives us include/ and lib/ under $(brew --prefix)/opt/ffmpeg, which
      # is exactly the layout avbridge/build.rs expects from FFMPEG_DIR. Homebrew GStreamer
      # puts pkg-config files under $(brew --prefix)/lib/pkgconfig, which gstreamer-sys
      # finds through PKG_CONFIG_PATH. gst-plugins-base provides gstreamer-app and
      # gstreamer-video (the two extra crates core depends on).
      - name: Install dependencies
        run: brew install ffmpeg gstreamer gst-plugins-base gst-plugins-bad

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Export FFMPEG_DIR and PKG_CONFIG_PATH
        run: |
          brew_prefix=$(brew --prefix)
          echo "FFMPEG_DIR=${brew_prefix}/opt/ffmpeg" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${brew_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace
